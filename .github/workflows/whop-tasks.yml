name: Whop one-off tasks

# Deliberate, manual Whop-side actions (runners have unrestricted egress,
# unlike the Arena sandbox). Requires the WHOP_API_KEY repo secret.
# Trigger: Actions tab -> "Whop one-off tasks" -> Run workflow -> pick a task.

on:
  workflow_dispatch:
    inputs:
      task:
        description: Which one-off task to run
        required: true
        type: choice
        options:
          - find-app
          - find-plans
          - watcher-plan
          - deploy-preview
          - deploy

jobs:
  find-app:
    if: ${{ inputs.task == 'find-app' }}
    runs-on: ubuntu-latest
    steps:
      - name: Find the Numinous app id (for whop.app.json)
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
        run: |
          # First hit wins:
          #  1. list the key's companies (proves which account the key belongs to)
          #  2. list apps: filtered, unfiltered, then per-company via account_id
          #  3. scrape the live site HTML for embedded app_* ids
          #  4. best-effort: the Whop CLI's own apps list
          # Docs: https://docs.whop.com/api-reference/apps/list-apps
          match_apps() {
            jq -r '(.data // .items // [] | if type == "array" then . else [.] end)[]?
              | select(((.route? // "") + " " + (.hosted_url? // "") + " " + (.short_name? // "") + " " + (.name? // ""))
                | test("jointhenuminouses|numinous"; "i"))
              | "\(.id)\tname=\(.name // .short_name // "?")\troute=\(.route // "?")"' "$1"
          }
          count_items() {
            jq -r '(.data // .items // []) | if type == "array" then length else 1 end' "$1" 2>/dev/null || echo "?"
          }
          FOUND=""
          try_match() {
            local m
            m=$(match_apps "$1")
            if [ -n "$m" ]; then
              echo "MATCH ($2):"
              echo "$m"
              FOUND=1
            else
              echo "no match ($2; $(count_items "$1") items returned)"
            fi
          }

          echo "== 1. key's companies =="
          cstatus=$(curl -sS -o companies.json -w '%{http_code}' \
            "https://api.whop.com/api/v1/companies" \
            -H "Authorization: Bearer $WHOP_API_KEY")
          echo "companies HTTP $cstatus"
          if [ "$cstatus" = "200" ]; then
            jq -r '(.data // .items // [] | if type == "array" then . else [.] end)[]?
              | "\(.id)\troute=\(.route // "?")\ttitle=\(.title // .name // "?")"' companies.json
          else
            head -c 500 companies.json; echo
          fi

          echo "== 2a. apps (filtered) =="
          status=$(curl -sS -o apps.json -w '%{http_code}' \
            "https://api.whop.com/api/v1/apps?first=100&query=jointhenuminouses" \
            -H "Authorization: Bearer $WHOP_API_KEY")
          echo "GET HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Could not list apps (HTTP $status). Check that the WHOP_API_KEY repo secret holds a valid Account API key (the apik_… value only, no WHOP_API_KEY= prefix, no spaces)."
            head -c 2000 apps.json
            exit 1
          fi
          try_match apps.json "filtered"
          if [ -z "$FOUND" ]; then
            echo "== 2b. apps (unfiltered) =="
            status=$(curl -sS -o apps.json -w '%{http_code}' \
              "https://api.whop.com/api/v1/apps?first=100" \
              -H "Authorization: Bearer $WHOP_API_KEY")
            echo "GET HTTP $status"
            [ "$status" = "200" ] || { head -c 500 apps.json; exit 1; }
            try_match apps.json "unfiltered"
          fi
          BIZ_IDS=""
          [ "$cstatus" = "200" ] && BIZ_IDS=$(jq -r '(.data // .items // [] | if type == "array" then . else [.] end)[]? | .id' companies.json)
          kv=$(curl -sS -o known-plan.json -w '%{http_code}' \
            "https://api.whop.com/api/v1/variants/plan_PQnMYNixMTjRQ" \
            -H "Authorization: Bearer $WHOP_API_KEY") || kv="000"
          if [ "$kv" = "200" ]; then
            ka=$(jq -r '.data.account.id // .account.id // empty' known-plan.json) || ka=""
            [ -n "$ka" ] && BIZ_IDS="$BIZ_IDS $ka"
          fi
          BIZ_IDS=$(echo "$BIZ_IDS" | tr ' ' '\n' | grep -v '^\s*$' | sort -u) || true
          if [ -z "$FOUND" ] && [ -n "$BIZ_IDS" ]; then
            echo "== 2c. apps per company (account_id) =="
            for biz in $BIZ_IDS; do
              [ -n "$FOUND" ] && break
              astatus=$(curl -sS -o apps-biz.json -w '%{http_code}' \
                "https://api.whop.com/api/v1/apps?first=100&account_id=${biz}" \
                -H "Authorization: Bearer $WHOP_API_KEY") || astatus="000"
              echo "company $biz -> HTTP $astatus"
              [ "$astatus" = "200" ] && try_match apps-biz.json "account_id=$biz"
            done
          fi

          if [ -z "$FOUND" ]; then
            echo "== 3. live-site HTML scrape =="
            if curl -sS "https://jointhenuminouses.whop.site/" -o home.html; then
              ids=$(grep -o 'app_[A-Za-z0-9]\{8,\}' home.html | sort -u || true)
              if [ -n "$ids" ]; then
                echo "MATCH (embedded in live homepage HTML):"
                echo "$ids"
                FOUND=1
              else
                echo "no app_* id embedded in the live homepage HTML"
              fi
            else
              echo "could not fetch the live homepage"
            fi
          fi

          if [ -z "$FOUND" ]; then
            echo "== 4. Whop CLI apps list (best effort) =="
            npx -y @whop/cli@0.25.0 apps list 2>&1 | head -n 30 || true
          fi

          echo "---"
          if [ -z "$FOUND" ]; then
            echo "::error::No Numinous app found. Likely causes: (a) the WHOP_API_KEY was generated under a different Whop user than the thenuminouses owner — check which account is logged in at whop.com/dashboard/developer and regenerate there; (b) the app lives under another company — see the company list above. Manual fallback: open the Numinous app at whop.com/dashboard → Developer → Apps — the app_* id is in the page URL."
            exit 1
          fi
          echo "Next: put the app_* id above into whop.app.json (copy whop.app.example.json),"
          echo "commit it, then run this workflow with task=deploy."

  watcher-plan:
    if: ${{ inputs.task == 'watcher-plan' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set the Watcher plan to $28 / 28 days with 7-day trial
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
        run: |
          # Plans are "variants" on API v1 (ids stay plan_-prefixed).
          # Docs: https://docs.whop.com/api-reference/beta/variants/update-variant
          # House truth: 7-day free trial, then $28 every 28 days. No discounts.
          status=$(curl -sS -o patch-response.json -w '%{http_code}' \
            -X PATCH "https://api.whop.com/api/v1/variants/plan_PQnMYNixMTjRQ" \
            -H "Authorization: Bearer $WHOP_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"trial_period_days": 7, "renewal_price": 28, "billing_period": 28, "currency": "usd"}')
          echo "PATCH HTTP $status"
          head -c 2000 patch-response.json; echo
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ] || exit 1

          status=$(curl -sS -o plan.json -w '%{http_code}' \
            "https://api.whop.com/api/v1/variants/plan_PQnMYNixMTjRQ" \
            -H "Authorization: Bearer $WHOP_API_KEY")
          echo "GET HTTP $status"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ] || { cat plan.json; exit 1; }
          jq '(.data // .) | {id, trial_period_days, renewal_price, billing_period, currency}' plan.json
          jq -e '(.data // .) | (.trial_period_days == 7)
            and ((.renewal_price == 28) or (.renewal_price == "28") or (.renewal_price == "28.00"))
            and (.billing_period == 28)' plan.json \
            || { echo "::error::Plan does not match the House terms after the PATCH."; exit 1; }
          echo "Watcher plan verified: 7-day trial, \$28.00, every 28 days."

  find-plans:
    if: ${{ inputs.task == 'find-plans' }}
    runs-on: ubuntu-latest
    steps:
      - name: List every plan on the account (find the annual Watcher)
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
        run: |
          # The variants list requires account_id. Resolve it from the known
          # Watcher plan (a single retrieve carries account.id), falling back
          # to the companies list.
          # Docs: https://docs.whop.com/api-reference/beta/variants/list-variants
          BIZ_IDS=""
          vstatus=$(curl -sS -o known-plan.json -w '%{http_code}' \
            "https://api.whop.com/api/v1/variants/plan_PQnMYNixMTjRQ" \
            -H "Authorization: Bearer $WHOP_API_KEY") || vstatus="000"
          echo "known-plan HTTP $vstatus"
          if [ "$vstatus" = "200" ]; then
            vacct=$(jq -r '.data.account.id // .account.id // empty' known-plan.json) || vacct=""
            vprod=$(jq -r '.data.product.title // .product.title // "?"' known-plan.json) || vprod="?"
            echo "Watcher plan account: ${vacct:-?} (product: $vprod)"
            BIZ_IDS="$vacct"
          else
            head -c 1000 known-plan.json; echo
          fi
          cstatus=$(curl -sS -o companies.json -w '%{http_code}' \
            "https://api.whop.com/api/v1/companies" \
            -H "Authorization: Bearer $WHOP_API_KEY") || cstatus="000"
          echo "companies HTTP $cstatus"
          if [ "$cstatus" = "200" ]; then
            extra=$(jq -r '(.data // .items // [] | if type == "array" then . else [.] end)[]? | .id' companies.json) || extra=""
            BIZ_IDS="$BIZ_IDS $extra"
          else
            head -c 1000 companies.json; echo
          fi
          BIZ_IDS=$(echo "$BIZ_IDS" | tr ' ' '\n' | grep -v '^\s*$' | sort -u) || true
          if [ -z "$BIZ_IDS" ]; then
            echo "::error::Could not resolve any account id. Paste this full log back for diagnosis."
            exit 1
          fi
          for biz in $BIZ_IDS; do
            vstatus=$(curl -sS -o plans.json -w '%{http_code}' \
              "https://api.whop.com/api/v1/variants?first=100&account_id=${biz}" \
              -H "Authorization: Bearer $WHOP_API_KEY") || vstatus="000"
            echo "== company $biz -> HTTP $vstatus =="
            if [ "$vstatus" != "200" ]; then head -c 1000 plans.json; echo; continue; fi
            jq -r '(.data // [])[]?
              | "\(.id)\tproduct=\(.product.title // "?")\ttitle=\(.title // "?")\ttype=\(.plan_type // "?")\tbilling_days=\(.billing_period // "-")\ttrial=\(.trial_period_days // "-")\trenewal=\(.renewal_price // "-") \(.currency // "")\t\(.purchase_url // "")"' plans.json
          done
          echo "---"
          echo "Copy the annual Watcher plan_* id + purchase_url above for wiring it into the site."

  deploy-preview:
    if: ${{ inputs.task == 'deploy-preview' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the storefront
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Require a real app manifest
        run: |
          if [ ! -f whop.app.json ]; then
            echo "::error::whop.app.json is missing. Put the real app_* id for the Numinous app (route jointhenuminouses) in it and commit."
            exit 1
          fi
          if grep -q "app_xxxxxxxx" whop.app.json; then
            echo "::error::whop.app.json still contains the placeholder app_xxxxxxxx id."
            exit 1
          fi

      - name: Validate Numinous 2.0 release package
        run: npm run build && npm run verify:build

      - name: Upload a preview build (does NOT go live)
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
        run: |
          npx whop apps deploy --preview
          echo "---"
          echo "Preview uploaded. Inspect the build id above, then run this workflow"
          echo "with task=deploy to promote it to jointhenuminouses.whop.site."

  deploy:
    if: ${{ inputs.task == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the storefront
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Require a real app manifest
        run: |
          if [ ! -f whop.app.json ]; then
            echo "::error::whop.app.json is missing. Run: cp whop.app.example.json whop.app.json, then put the real app_* id for the Numinous app (route jointhenuminouses) in it and commit."
            exit 1
          fi
          if grep -q "app_xxxxxxxx" whop.app.json; then
            echo "::error::whop.app.json still contains the placeholder app_xxxxxxxx id."
            exit 1
          fi

      - name: Validate Numinous 2.0 release package
        run: npm run build && npm run verify:build

      - name: Deploy to jointhenuminouses.whop.site
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
        run: |
          npx whop auth status --format json || true
          npx whop apps deploy
