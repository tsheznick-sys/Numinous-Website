name: Bootstrap site files (one-time)

# Adding this file with a commit starts everything by itself: it installs the kit
# into main, deletes this workflow, then starts the deploy run that finds the
# website app for jointhenuminouses and ships the site. No further clicks.
# (Also runnable by hand from the Actions tab if ever needed.)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-site-files.yml"

permissions:
  contents: write
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Download the prepared files
        env:
          KIT_DRIVE: "https://drive.usercontent.google.com/download?id=1_9gDsFv30SYofSuUOF1uU2fBn80PfVdb&export=download&confirm=t"
          KIT_DRIVE_ALT: "https://drive.google.com/uc?export=download&id=1_9gDsFv30SYofSuUOF1uU2fBn80PfVdb"
          KIT_SANDBOX: "https://8099-im3t09yup5zhtau03hbma.e2b.app/site-files.zip"
        run: |
          set -euo pipefail
          ok=""
          for url in "$KIT_DRIVE" "$KIT_DRIVE_ALT" "$KIT_SANDBOX"; do
            curl -fsSL --retry 2 --max-time 120 "$url" -o /tmp/kit.zip || { echo "miss: $url"; continue; }
            python3 -c "import zipfile,sys; sys.exit(zipfile.ZipFile('/tmp/kit.zip').testzip() is not None)" \
              && { echo "kit from: $url"; ok=yes; break; } || echo "bad zip: $url"
          done
          [ -n "$ok" ] || { echo "::error::no valid kit zip from any source"; exit 1; }

      - name: Apply the files (verified first)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("/tmp/kit.zip")
          names = [n for n in z.namelist() if not n.endswith("/")]
          needed = ["src/site.js", "vite.config.js",
                    ".github/workflows/whop-site-app.yml",
                    ".github/workflows/whop-tasks.yml",
                    ".github/workflows/developer-actions.yml",
                    "fix-live-site.sh", "reference/gate-pages.raw.html",
                    "developer-actions/last-run.json"]
          missing = [n for n in needed if n not in names]
          assert not missing, f"kit missing {missing}"
          assert z.testzip() is None, "corrupt zip"
          z.extractall(".")
          print(f"applied {len(names)} files")
          PY
          grep -q "checkout.watcher" src/site.js
          grep -q "find-and-deploy" .github/workflows/whop-site-app.yml
          grep -q "@cloudflare/vite-plugin" vite.config.js
          echo "guards passed"

      - name: Commit and push to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/bootstrap-site-files.yml
          git add -A
          git commit -m "Site: checkout-only storefront, website-app deploy task, CI on Node 24 actions"
          git push origin HEAD:main

      - name: Start the deploy run (find the website app + ship the site)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            if gh workflow run "Whop site app (find + deploy the website)" -f task=find-and-deploy; then
              echo "deploy run started - watch it under the Actions tab"; exit 0
            fi
            echo "workflow not visible yet, retry $i"; sleep 20
          done
          echo "::warning::Start it yourself: Actions -> Whop site app (find + deploy the website) -> Run workflow -> find-and-deploy"
